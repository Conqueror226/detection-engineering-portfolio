id: T1021.001_rdp_lateral_movement
name: RDP Lateral Movement Followed by Process Execution
category: signature            # signature | classic
status: development            # development | tested | production
author: Désiré Abdoul Kader Bonzi
created: 2026-08-10

description: >
  Detects a successful RemoteInteractive (RDP) logon immediately followed by
  process execution by the same account on the same host, indicating likely
  hands-on-keyboard lateral movement.

query_language: eql
query_file: query.eql
rule_file: rule.toml

platforms:
  - windows

data_sources:
  - Windows Security Event Log (Event ID 4624)
  - Sysmon / process creation (Event ID 1)

attack:
  - tactic: Lateral Movement
    tactic_id: TA0008
    technique: "Remote Services: Remote Desktop Protocol"
    technique_id: T1021.001

false_positives:
  - Legitimate administrative RDP sessions.
  - Jump hosts and bastion servers where the pattern is expected.
  - Automation or monitoring accounts that use RDP by design.

references:
  - https://attack.mitre.org/techniques/T1021/001/
  - https://www.elastic.co/security-labs/topics/detection-engineering

validation:
  true_positive: test_data/true_positive.json
  false_positive: test_data/false_positive.json
