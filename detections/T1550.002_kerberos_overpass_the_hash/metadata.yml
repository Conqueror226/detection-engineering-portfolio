id: T1550.002_kerberos_overpass_the_hash
name: Anomalous RC4 Kerberos TGT Request (Potential Overpass-the-Hash)
category: signature            # signature | classic
status: development           # development | tested | production
author: Désiré Abdoul Kader Bonzi
created: 2026-08-10

description: >
  Detects a Kerberos TGT (Event 4768) issued for a user account with RC4-HMAC
  encryption in an AES-only domain, a common indicator of overpass-the-hash used
  to pivot from a stolen NTLM hash to Kerberos-based lateral movement.

query_language: eql
query_file: query.eql
rule_file: rule.toml

platforms:
  - windows

data_sources:
  - Windows Security Event Log (Event ID 4768)

attack:
  - tactic: Lateral Movement
    tactic_id: TA0008
    technique: "Use Alternate Authentication Material: Pass the Hash"
    technique_id: T1550.002

false_positives:
  - Legacy systems that still negotiate RC4 Kerberos encryption.
  - Domains mid-migration to AES where RC4 is not yet disabled.
  - Service or interop accounts explicitly configured for RC4.

references:
  - https://attack.mitre.org/techniques/T1550/002/
  - https://www.elastic.co/security-labs/topics/detection-engineering

validation:
  true_positive: test_data/true_positive.json
  false_positive: test_data/false_positive.json
