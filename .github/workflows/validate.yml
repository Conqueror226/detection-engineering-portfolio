name: Validate Detections

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Generate deterministic pipeline PCAP
        run: python3 fixtures/pipeline/generate.py

      - name: Validate contracts and context (PR1 gates)
        run: |
          python3 automation/validate_schemas.py
          python3 automation/validate_context.py
          python3 automation/test_edge_contract.py
          python3 automation/test_edge_materialization.py
          python3 automation/test_pipeline.py
          python3 automation/test_evidence_io.py
          python3 automation/test_hybrid_reachability.py
          python3 automation/test_reconstruct_case.py

      - name: Validate all detection rules
        run: python3 automation/validate_rules.py

      - name: Run detection logic tests (EQL)
        run: python3 automation/test_detections.py

      - name: Test ECS sensor against fixtures
        run: python3 automation/test_sensor.py

      - name: Test pivot-progression classifier
        run: python3 automation/test_progression.py

      - name: Generate coverage artifacts
        run: |
          mkdir -p artifacts
          python3 automation/coverage_report.py | tee artifacts/coverage_report.txt
          python3 automation/generate_navigator_layer.py
          cp attack_navigator/coverage_layer.json artifacts/coverage_layer.json

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: detection-coverage-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
